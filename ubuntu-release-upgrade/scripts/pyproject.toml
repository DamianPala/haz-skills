[project]
name = "ubuntu-release-upgrade"
version = "0.1.0"
description = "Read-only inspection helpers for guiding an Ubuntu/Kubuntu release upgrade"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
]

[project.scripts]
ubuntu-release-upgrade = "ubuntu_release_upgrade.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
